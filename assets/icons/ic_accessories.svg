<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sunglasses outline matching image style -->
  <!-- Left lens -->
  <rect x="6" y="22" width="20" height="16" rx="8" stroke="#1F2023" stroke-width="2.2"/>
  <!-- Right lens -->
  <rect x="38" y="22" width="20" height="16" rx="8" stroke="#1F2023" stroke-width="2.2"/>
  <!-- Bridge between lenses -->
  <path d="M26 30 C28 26 36 26 38 30" stroke="#1F2023" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left arm -->
  <path d="M6 30 L2 30" stroke="#1F2023" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right arm -->
  <path d="M58 30 L62 30" stroke="#1F2023" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Lens glare hints -->
  <path d="M13 26 L16 26" stroke="#1F2023" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M45 26 L48 26" stroke="#1F2023" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>

